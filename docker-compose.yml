services:
  backend:
    build: ./backend
    restart: unless-stopped
    # Override APP_UID/APP_GID when the user owning ./data is not uid 1000.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      DB_PATH: /data/roadmap.db
      PORT: "8080"
    volumes:
      - ./data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
