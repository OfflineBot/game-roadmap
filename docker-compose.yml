services:
  backend:
    build: ./backend
    environment:
      DB_PATH: /data/roadmap.db
      PORT: "8080"
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
